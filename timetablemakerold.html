<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Train Timetable Maker</title>
<style>
:root{--bg:#141c2b;--panel:#0d1422;--line:#26324a;--txt:#dce6f5;--mut:#8da0bd;--acc:#38bdf8;--sf:#ff7a59;--ex:#2fd4ff;--sel:#fde047;--ok:#4ade80;--bad:#f87171}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--txt);font:14px/1.35 system-ui,Segoe UI,Roboto,sans-serif;display:flex;flex-direction:column;overflow:hidden}
header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:10px 16px}
h1{font-size:17px;margin:0}.sub{color:var(--mut);font-size:12px}
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
button,select,input{font:inherit;color:var(--txt)}
button,select{background:#0b1220;border:1px solid var(--line);border-radius:7px;padding:7px 12px;cursor:pointer}
button:hover:not(:disabled),select:hover{border-color:var(--acc)}
button:disabled{opacity:.45;cursor:not-allowed}
button.pri{background:#0e4f72;border-color:var(--acc)}button.on{background:#14532d;border-color:var(--ok)}
input{background:#0b1220;border:1px solid var(--line);border-radius:6px;padding:6px 8px;min-width:0}
input:focus,select:focus{outline:1px solid var(--acc)}
main{flex:1;display:flex;gap:12px;padding:0 16px 12px;min-height:0}
#mapwrap{flex:1;min-width:0;position:relative;overflow:hidden;border-radius:10px;border:1px solid var(--line);background:#121821;background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:32px 32px}
#map{width:100%;height:100%;display:block;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none}#map.drag{cursor:grabbing}
.nm{font:600 7.5px system-ui,Segoe UI,Roboto,sans-serif;pointer-events:none;paint-order:stroke;stroke:#121821;stroke-width:1.6px}
#hintbar{position:absolute;left:10px;top:10px;right:10px;pointer-events:none;display:none}
#hintbar span{display:inline-block;background:rgba(11,18,32,.93);border:1px solid var(--acc);border-radius:8px;padding:6px 11px;font-size:13px}
#tip{position:absolute;z-index:6;pointer-events:none;background:rgba(11,18,32,.96);border:1px solid var(--acc);border-radius:8px;padding:5px 9px;font-size:12px;display:none}
aside{width:430px;display:flex;flex-direction:column;gap:12px;min-height:0;overflow:auto}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;flex:none}
.card h3{margin:0 0 8px;font-size:15px;color:var(--acc);display:flex;justify-content:space-between;align-items:center;gap:8px}
.hint{color:var(--mut);font-size:12.5px}.warn{color:#f0b37a;font-size:12.5px}
.f{display:flex;gap:8px;align-items:center;margin:6px 0}.f label{width:120px;color:var(--mut);font-size:12.5px;flex:none}.f input,.f select{flex:1}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.sum{background:#0b1220;border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-size:12.5px;margin:6px 0}
.chip{display:inline-block;background:#1b2740;border-radius:999px;padding:1px 8px;margin:2px 3px 0 0;cursor:pointer;font-size:12px}.chip:hover{background:#3a2740}
.sc{overflow:auto;max-height:46vh}
table{border-collapse:collapse;width:100%;font-size:12.5px}
td,th{padding:3px 5px;text-align:left;border-bottom:1px solid #1b2538;vertical-align:middle}
th{color:var(--mut);font-weight:500;position:sticky;top:0;background:var(--panel);z-index:1}
tr.off td{opacity:.4}
.tc{display:flex;align-items:center;gap:3px}.tc input{width:68px;text-align:center;padding:4px}.tc button{padding:1px 6px;font-size:13px;line-height:1.3}
.g{display:block;color:var(--mut);font-size:10.5px;text-align:center}.est{color:#f0b37a}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}
.item{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:6px 0;border-bottom:1px solid #1b2538}.item .nmv{font-weight:600;font-size:13px}.item button{padding:3px 9px;font-size:12px}
.xb{padding:0 9px;font-size:18px;line-height:24px}
.modal{position:fixed;inset:0;background:rgba(8,12,20,.9);z-index:50;display:none;padding:14px;overflow:auto}
.mbox{max-width:900px;margin:0 auto;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.mbox h2{margin:0 0 8px;font-size:17px}.mbox h4{margin:14px 0 4px;display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:14px}
.mbox table td,.mbox table th{padding:3px 8px}.mbox td{font-family:ui-monospace,Consolas,monospace}
.chk{display:inline-flex;align-items:center;gap:5px;color:var(--mut);font-size:12.5px}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#0e4f72;border:1px solid var(--acc);padding:8px 16px;border-radius:999px;z-index:99;display:none}
@media(max-width:900px){
 html,body{height:auto}body{display:block;overflow:auto}
 header{padding:8px 10px}h1{font-size:15px}.ctl{gap:6px}.ctl button{padding:6px 9px;font-size:12.5px}
 main{flex-direction:column;padding:0 10px 14px;gap:10px;overflow:visible}
 #mapwrap{position:sticky;top:0;z-index:20;flex:none;height:46vh}
 aside{width:auto;overflow:visible}.sc{max-height:none}
 .f label{width:96px}
}
#sq{width:100%;background:#0b1220;color:var(--txt);border:1px solid var(--line);border-radius:7px;padding:8px 12px;font:inherit;margin:4px 0 8px}
#uw{position:relative;flex:1;min-width:170px;max-width:340px}
#uq{width:100%;background:#0b1220;color:var(--txt);border:1px solid var(--line);border-radius:7px;padding:7px 12px;font:inherit}
#ures{display:none;position:absolute;top:100%;left:0;right:0;z-index:60;max-height:50vh;overflow:auto;background:var(--panel);border:1px solid var(--acc);border-radius:8px;margin-top:4px}
.ur{padding:10px 12px;cursor:pointer;border-bottom:1px solid var(--line)}.ur:hover{background:#1a2740}
@media(max-width:900px){#sq,#uq{font-size:16px}#uw{max-width:none;flex-basis:100%}}
</style>
</head>
<body>
<header>
  <div><h1>Train Timetable Maker</h1><div class="sub" id="sub">Load your Excel so the page can learn travel times, then create trains on the map</div></div>
  <div class="ctl">
    <button id="bExcel">Load Excel (.xlsx / .csv)</button>
    <button id="bCreate" class="pri" disabled>&#65291; Create train</button>
    <button id="bOut">Output page (<span id="nOut">0</span>)</button>
    <span id="uw"><input id="uq" type="search" placeholder="Search any train (file + created)" autocomplete="off"><div id="ures"></div></span><button id="bZin">+</button><button id="bZout">&minus;</button><button id="bReset">Reset View</button>
  </div>
  <input type="file" id="fExcel" accept=".xlsx,.xlsm,.csv" hidden>
</header>
<main>
  <div id="mapwrap">
    <svg id="map" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 896" preserveAspectRatio="xMidYMid meet">
      <g id="themeL"></g><g id="routeL"></g><g id="stL"></g><g id="markL" pointer-events="none"></g>
    </svg>
    <div id="hintbar"><span id="hintTxt"></span></div>
    <div id="tip"></div>
  </div>
  <aside>
    <div class="card" id="cInfo"><h3>Station timetable</h3><input id="sq" type="search" placeholder="Search trains at this station" autocomplete="off" style="display:none"><div id="info" class="hint">Load your Excel, then click any station to see the trains that stop there.</div></div>
    <div class="card" id="cNew" style="display:none"></div>
    <div class="card" id="cList"><h3>Created trains <span class="hint" id="cnt">0</span></h3><div id="list" class="hint">Nothing created yet.</div></div>
  </aside>
</main>
<div class="modal" id="out"><div class="mbox">
  <h2>Output &mdash; timetables ready to copy</h2>
  <div class="btns">
    <button class="pri" id="oCopy">Copy all (paste into Excel)</button>
    <button id="oXlsx">Download .xlsx</button><button id="oCsv">Download .csv</button><button id="oClose">Close</button>
    <label class="chk"><input type="checkbox" id="oHead" checked> header row</label>
    <label class="chk"><input type="checkbox" id="oSep" checked> "/" separator rows</label>
  </div>
  <div id="oBody"></div>
</div></div>
<div id="toast"></div>

  const hb=$('hintbar');hb.style.display=createMode?'block':'none';$('hintTxt').textContent=hintText();
  if(!createMode||!D)return;const p=D.path;
  if(p.length>1){const pts=[];for(let i=1;i<p.length;i++){const e=EDGE[p[i-1]+'-'+p[i]];for(let j=(i>1?1:0);j<e.p.length;j++)pts.push(e.p[j].join(','))}
    el('polyline',{points:pts.join(' '),fill:'none',stroke:'#fde047','stroke-width':3.6,'stroke-opacity':.85,'stroke-linejoin':'round','stroke-linecap':'round'},R);
    p.forEach(n=>el('circle',{cx:NODES[n].x,cy:NODES[n].y,r:3.6,fill:'#f59e0b',stroke:'#7c2d12','stroke-width':.8},R))}
  D.wp.forEach((n,k)=>{const nd=NODES[n],last=k===D.wp.length-1&&D.wp.length>1,first=k===0,col=first?'#22c55e':last?'#ef4444':'#38bdf8';
    el('circle',{cx:nd.x,cy:nd.y,r:7,fill:col,stroke:'#fff','stroke-width':1.4},M);const t=el('text',{x:nd.x,y:nd.y+2.8,'text-anchor':'middle',fill:'#fff','font-size':8,'font-weight':700,'font-family':'system-ui'},M);t.textContent=first?'S':last?'E':k})}
function renderDraft(){
  renderRouteMap();const C=$('cNew');if(!createMode||!D){C.style.display='none';return}C.style.display='';
  const n=D.path.length,done=n>1;
  let h=`<h3>${D.id?'Edit train':'New train'} <button class="xb" id="dClose" title="Close">&times;</button></h3>
  <div class="f"><label>Type</label><select id="dType"><option value="SF"${D.type==='SF'?' selected':''}>SF Express</option><option value="EX"${D.type==='EX'?' selected':''}>Express</option><option value="STB"${D.type==='STB'?' selected':''}>STB Express</option><option value="RAJ"${D.type==='RAJ'?' selected':''}>Raj Express</option></select></div>
  <div class="f"><label>Name</label><input id="dName" value="${esc(D.name)}" placeholder="auto: START - END type"></div>
  <div class="hint">${hintText()}</div>${D.msg?`<div class="warn">${esc(D.msg)}</div>`:''}`;
  if(D.wp.length){h+=`<div class="btns"><button id="dClear">Clear route</button></div>`}
  if(done){const via=D.wp.slice(1,-1);
    h+=`<div class="sum"><b>${NODES[D.path[0]].name} &rarr; ${NODES[D.path[n-1]].name}</b> &middot; ${n} stations${via.length?'<br>Via (tap to remove): '+via.map(v=>`<span class="chip" data-via="${v}">${NODES[v].name} &times;</span>`).join(''):''}</div>
    <div class="f"><label>Time 1 start<br><span style="font-size:11px">(first station)</span></label><input type="time" id="dS1" value="${D.s1==null?'':hhmm(D.s1)}"></div>
    <div class="f"><label>RT start<br><span style="font-size:11px">(bottom station)</span></label><input type="time" id="dS2" value="${D.s2==null?'':hhmm(D.s2)}"></div>
    <div class="hint">Edit a Time 1 cell and only the stations after it move. Edit a Time 2 cell and only the stations above it move. <span class="est">~</span> = travel time estimated, not directly in your Excel.</div>
    <div class="sc"><table id="dTab"><tr><th title="Train stops here">Stop</th><th>#</th><th>Station</th><th>Time 1</th><th>Time 2</th></tr>`;
    for(let i=0;i<n;i++){h+=`<tr class="${D.stops[i]?'':'off'}"><td><input type="checkbox" data-stop="${i}"${D.stops[i]?' checked':''}></td><td>${i+1}</td><td>${esc(NODES[D.path[i]].name)}</td><td>${tcell(1,i)}</td><td>${tcell(2,i)}</td></tr>`}
    h+=`</table></div><div class="btns"><button class="pri" id="dAdd">${D.id?'Save changes':'Add to list'}</button></div>`}
  C.innerHTML=h}
const hhmm=t=>{const m=((t%1440)+1440)%1440;return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0')};
function tcell(k,i){const arr=k===1?D.t1:D.t2,t=arr[i];let g='';
  if(t!=null){if(k===1&&i>0&&arr[i-1]!=null)g=`+${arr[i]-arr[i-1]}${D.srcs[i-1]!=='data'?'<span class="est">~</span>':''}`;
    if(k===2&&i<D.path.length-1&&arr[i+1]!=null)g=`+${arr[i]-arr[i+1]}${D.srcs[i]!=='data'?'<span class="est">~</span>':''}`}
  return `<div class="tc"><button data-k="${k}" data-i="${i}" data-d="-5">&minus;</button><input class="tin" data-k="${k}" data-i="${i}" value="${fmtC(t)}" placeholder="--:--"><button data-k="${k}" data-i="${i}" data-d="5">+</button></div><span class="g">${g}${t!=null?dayTag(t):''}</span>`}
function commitCell(k,i,abs){if(k===1)setT1(i,abs);else setT2(i,abs);renderDraft()}
$('cNew').addEventListener('change',e=>{const t=e.target;if(!D)return;
  if(t.id==='dType'){D.type=t.value;recalcGaps();refillAnchors();autoName();renderDraft()}
  else if(t.id==='dName'){D.name=t.value;D.nameAuto=false}
  else if(t.id==='dS1'||t.id==='dS2'){if(!t.value)return;const [h,m]=t.value.split(':').map(Number),abs=h*60+m,n=D.path.length;if(t.id==='dS1')setT1(0,abs);else{D.t2=Array(n).fill(null);setT2(n-1,abs)}renderDraft()}
  else if(t.classList.contains('tin')){const k=+t.dataset.k,i=+t.dataset.i,old=(k===1?D.t1:D.t2)[i],abs=parseUser(t.value,old);if(abs==null){toast('Time not understood: '+t.value);renderDraft();return}commitCell(k,i,abs)}
  else if(t.dataset.stop!=null){D.stops[+t.dataset.stop]=t.checked;renderDraft()}});
$('cNew').addEventListener('click',e=>{const t=e.target.closest('button,.chip');if(!t||!D)return;
  if(t.id==='dClose'){exitCreate()}
  else if(t.id==='dClear'){const keep={type:D.type};D=newDraft();D.type=keep.type;renderDraft()}
  else if(t.dataset.via!=null){const v=+t.dataset.via;setRoute(D.wp.filter(x=>x!==v));renderDraft()}
  else if(t.dataset.d!=null){const k=+t.dataset.k,i=+t.dataset.i,arr=k===1?D.t1:D.t2;if(arr[i]==null){toast('Set the start time first');return}commitCell(k,i,arr[i]+ +t.dataset.d)}
  else if(t.id==='dAdd')addTrain()});
function addTrain(){const n=D.path.length;
  if(n<2)return toast('Create a route first');if(!D.name.trim())return toast('Give the train a name');
  if(D.t1[0]==null&&D.t2[n-1]==null)return toast('Enter the Time 1 start time (and the RT start time)');
  if(D.stops.filter(Boolean).length<2)return toast('At least 2 stops are needed');
  const tr={id:D.id||uid++,name:D.name.trim(),nameAuto:D.nameAuto,type:D.type,wp:D.wp.slice(),path:D.path.slice(),stops:D.stops.slice(),t1:D.t1.slice(),t2:D.t2.slice(),gaps:D.gaps.slice(),srcs:D.srcs.slice(),s1:D.s1,s2:D.s2};
  const k=TRAINS.findIndex(x=>x.id===tr.id);if(k>=0)TRAINS[k]=tr;else TRAINS.push(tr);save();toast(k>=0?'Changes saved':'Train added to list');
  const ty=D.type;D=newDraft();D.type=ty;renderAll()}
function enterCreate(){createMode=true;D=D||newDraft();$('bCreate').classList.add('on');$('bCreate').innerHTML='&#10003; Creating (click to stop)';renderAll()}
function exitCreate(){createMode=false;$('bCreate').classList.remove('on');$('bCreate').innerHTML='&#65291; Create train';renderAll()}
$('bCreate').onclick=()=>createMode?exitCreate():enterCreate();

/* ---------- list + output ---------- */
function save(){try{localStorage.setItem('ttm_trains_v1',JSON.stringify({TRAINS,uid}))}catch(e){}}
function load(){try{const s=JSON.parse(localStorage.getItem('ttm_trains_v1')||'null');if(s&&s.TRAINS){TRAINS=s.TRAINS;uid=s.uid||TRAINS.length+1}}catch(e){}}
function renderList(){$('cnt').textContent=TRAINS.length;$('nOut').textContent=TRAINS.length;const b=$('list');
  if(!TRAINS.length){b.className='hint';b.textContent='Nothing created yet.';return}b.className='';
  b.innerHTML=TRAINS.map(t=>`<div class="item"><div><div class="nmv"><span class="dot" style="background:${TCOL(t.type)}"></span>${esc(t.name)}</div><div class="hint">${t.stops.filter(Boolean).length} stops &middot; ${t.t1[0]!=null?fmtC(t.t1[0]):'--'} &rarr; ${t.t1[t.path.length-1]!=null?fmtC(t.t1[t.path.length-1]):'--'}</div></div><div class="btns" style="margin:0"><button data-e="${t.id}">Edit</button><button data-x="${t.id}">Delete</button></div></div>`).join('')}
$('list').addEventListener('click',e=>{const t=e.target.closest('button');if(!t)return;
  if(t.dataset.x){if(confirm('Delete this train?')){TRAINS=TRAINS.filter(x=>x.id!==+t.dataset.x);save();renderAll()}}
  else if(t.dataset.e){const s=TRAINS.find(x=>x.id===+t.dataset.e);D=Object.assign(newDraft(),JSON.parse(JSON.stringify(s)),{msg:''});D.id=s.id;createMode=true;$('bCreate').classList.add('on');$('bCreate').innerHTML='&#10003; Creating (click to stop)';renderAll();$('cNew').scrollIntoView({block:'nearest'})}});
function genRows(t,o){const rows=[];t.path.forEach((nd,i)=>{if(!t.stops[i])return;rows.push([t.name,fmtC(t.t1[i]),LABEL[nd]||NODES[nd].name,fmtC(t.t2[i])])});return rows}
function allRows(o){const out=[];if(o.head)out.push(['Name','Time 1','Station','Time 2']);TRAINS.forEach(t=>{genRows(t).forEach(r=>out.push(r));if(o.sep)out.push(['/','/','/','/'])});return out}
const opts=()=>({head:$('oHead').checked,sep:$('oSep').checked});
const tsv=rows=>rows.map(r=>r.join('\t')).join('\n');
function renderOut(){const b=$('oBody');if(!TRAINS.length){b.innerHTML='<div class="hint">No trains yet. Create one first.</div>';return}
  b.innerHTML=TRAINS.map(t=>`<h4><span><span class="dot" style="background:${TCOL(t.type)}"></span>${esc(t.name)}</span><button data-c="${t.id}">Copy this train</button></h4><div class="sc" style="max-height:none"><table><tr><th>Name</th><th>Time 1</th><th>Station</th><th>Time 2</th></tr>${genRows(t).map(r=>'<tr>'+r.map(c=>'<td>'+esc(c)+'</td>').join('')+'</tr>').join('')}</table></div>`).join('')}
async function copyText(s){try{await navigator.clipboard.writeText(s)}catch(e){const a=document.createElement('textarea');a.value=s;document.body.appendChild(a);a.select();document.execCommand('copy');a.remove()}toast('Copied - paste into Excel')}
$('bOut').onclick=()=>{renderOut();$('out').style.display='block'};$('oClose').onclick=()=>$('out').style.display='none';
$('oCopy').onclick=()=>copyText(tsv(allRows(opts())));
$('oBody').addEventListener('click',e=>{const t=e.target.closest('button');if(!t||!t.dataset.c)return;const tr=TRAINS.find(x=>x.id===+t.dataset.c);const o=opts(),rows=[];if(o.head)rows.push(['Name','Time 1','Station','Time 2']);genRows(tr).forEach(r=>rows.push(r));if(o.sep)rows.push(['/','/','/','/']);copyText(tsv(rows))});
function dl(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}
$('oCsv').onclick=()=>{if(!TRAINS.length)return toast('Nothing to download');dl(new Blob(['\ufeff'+allRows(opts()).map(r=>r.map(c=>/[",\n]/.test(c)?'"'+c.replace(/"/g,'""')+'"':c).join(',')).join('\r\n')],{type:'text/csv'}),'Created_Trains.csv')};
$('oXlsx').onclick=()=>{if(!TRAINS.length)return toast('Nothing to download');dl(makeXlsx(allRows(opts())),'Created_Trains.xlsx')};
/* minimal .xlsx writer (stored zip + inline strings) */
const CRC=(()=>{const t=[];for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
const crc32=u=>{let c=0xFFFFFFFF;for(let i=0;i<u.length;i++)c=CRC[(c^u[i])&255]^(c>>>8);return(c^0xFFFFFFFF)>>>0};
function makeXlsx(rows){const enc=new TextEncoder(),X=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const col=i=>String.fromCharCode(65+i);
  const sheet='<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><cols><col min="1" max="1" width="34" customWidth="1"/><col min="2" max="4" width="16" customWidth="1"/></cols><sheetData>'+
    rows.map((r,ri)=>`<row r="${ri+1}">`+r.map((c,ci)=>c===''?'':`<c r="${col(ci)}${ri+1}" t="inlineStr"><is><t xml:space="preserve">${X(String(c))}</t></is></c>`).join('')+'</row>').join('')+'</sheetData></worksheet>';
  const files=[['[Content_Types].xml','<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/></Types>'],
    ['_rels/.rels','<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>'],
    ['xl/workbook.xml','<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets><sheet name="Sheet1" sheetId="1" r:id="rId1"/></sheets></workbook>'],
    ['xl/_rels/workbook.xml.rels','<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/></Relationships>'],
    ['xl/worksheets/sheet1.xml',sheet]];
  const parts=[],cd=[];let off=0,cds=0;
  for(const [name,txt] of files){const nm=enc.encode(name),data=enc.encode(txt),crc=crc32(data);
    const lh=new DataView(new ArrayBuffer(30));lh.setUint32(0,0x04034b50,true);lh.setUint16(4,20,true);lh.setUint16(10,0,true);lh.setUint16(12,33,true);lh.setUint32(14,crc,true);lh.setUint32(18,data.length,true);lh.setUint32(22,data.length,true);lh.setUint16(26,nm.length,true);
    const ch=new DataView(new ArrayBuffer(46));ch.setUint32(0,0x02014b50,true);ch.setUint16(4,20,true);ch.setUint16(6,20,true);ch.setUint16(14,33,true);ch.setUint32(16,crc,true);ch.setUint32(20,data.length,true);ch.setUint32(24,data.length,true);ch.setUint16(28,nm.length,true);ch.setUint32(42,off,true);
    parts.push(lh,nm,data);cd.push(ch,nm);off+=30+nm.length+data.length;cds+=46+nm.length}
  const e=new DataView(new ArrayBuffer(22));e.setUint32(0,0x06054b50,true);e.setUint16(8,files.length,true);e.setUint16(10,files.length,true);e.setUint32(12,cds,true);e.setUint32(16,off,true);
  return new Blob([...parts,...cd,e],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'})}

/* ---------- loading the Excel ---------- */
async function loadFile(f){
  try{const rows=/\.csv$/i.test(f.name)?readCsv(await f.text()):await readXlsx(await f.arrayBuffer());
    const r=learn(rows);if(!r.nTrains)throw new Error('No trains found - expected columns Name, Time 1, Station, Time 2');
    $('bCreate').disabled=false;
    $('sub').innerHTML=`${esc(f.name)}: ${r.nTrains} trains read &middot; travel times learned for ${r.withData} track segments, the rest estimated from distance &middot; SF runs about ${Math.round((1-RATIO)*100)}% faster`+(NOTES.length?` &middot; <a href="#" id="nLink" style="color:#f0b37a">${NOTES.length} data note(s)</a>`:'');
    const nl=$('nLink');if(nl)nl.onclick=ev=>{ev.preventDefault();alert(NOTES.join('\n'))};
    selStation=null;renderAll()}
  catch(err){console.error(err);alert('Could not read file: '+err.message)}}
$('bExcel').onclick=()=>$('fExcel').click();
$('fExcel').onchange=e=>{if(e.target.files[0])loadFile(e.target.files[0]);e.target.value=''};
['dragenter','dragover'].forEach(t=>window.addEventListener(t,e=>e.preventDefault()));
window.addEventListener('drop',e=>{e.preventDefault();if(e.dataTransfer.files[0])loadFile(e.dataTransfer.files[0])});
function renderAll(){renderInfo();renderDraft();renderList()}
load();renderAll();
</script>
</body>
